name: DevOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PyTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=student-result-management
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=test_*.py
            -Dsonar.exclusions=.venv/**,venv/**,**/__pycache__/**,.pytest_cache/**,**/*.pyc

  docker:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t student-result-management:ci .
      - name: Run container
        run: docker run -d --name result-app -p 5000:5000 student-result-management:ci
      - name: Wait for health endpoint
        run: |
          for i in {1..15}; do
            if curl --fail http://127.0.0.1:5000/health; then exit 0; fi
            sleep 2
          done
          docker logs result-app
          exit 1
      - name: Check result endpoint
        run: curl --fail http://127.0.0.1:5000/results/101
      - name: Check unknown roll number returns 404
        run: |
          code=$(curl -s -o /tmp/not-found.json -w "%{http_code}" http://127.0.0.1:5000/results/999)
          test "$code" = "404"
      - name: Show container logs
        if: always()
        run: docker logs result-app || true
      - name: Remove container
        if: always()
        run: docker rm -f result-app || true
